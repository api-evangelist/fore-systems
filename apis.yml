name: FORE Systems
description: FORE Systems, Inc. was a computer network switching equipment company based in
  Warrendale (Pittsburgh), Pennsylvania, founded in 1990 by Carnegie Mellon researchers Francois
  Bitz, Onat Menzilcioglu, Robert Sansom and Eric Cooper (the "FORE" acronym) to build Asynchronous
  Transfer Mode (ATM) network interface cards and switches. It was the first company to commercially
  ship an ATM switch (the ASX-100) in 1992 and grew through acquisitions (ALANTEC, Applied Network
  Technology, RainbowBridge, CellAccess) before being acquired by Britain's General Electric Company
  (GEC) in 1999, folded into Marconi, and ultimately absorbed by Ericsson in 2006. The company is
  defunct and has no active API surface, developer portal, or product endpoints; this profile is a
  historical/company record in the API Evangelist network.
